server:
  port: ${PORT:8091}
  shutdown: graceful

spring:
  application:
    name: trade-imports-plants-backend
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/}
      database: ${MONGO_DATABASE:trade-imports-plants-backend}
      auto-index-creation: true
      read-preference: ${MONGO_READ_PREFERENCE:primary}
      write-concern: ${MONGO_WRITE_CONCERN:majority}
      connection-pool:
        min-size: ${MONGO_POOL_MIN_SIZE:10}
        max-size: ${MONGO_POOL_MAX_SIZE:100}
        max-wait-time-ms: ${MONGO_POOL_MAX_WAIT_TIME_MS:2000}
        max-connection-idle-time-ms: ${MONGO_POOL_MAX_IDLE_TIME_MS:60000}
      ssl:
        enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    serialization:
      # The Notification content sub-object is a deliberate placeholder with no fields until the
      # plants data model is agreed, and Jackson refuses to serialize a zero-property bean by
      # default. Remove this once Notification carries fields.
      fail-on-empty-beans: false


# CDP platform configuration
cdp:
  certificate: ${TRUSTSTORE_CDP_ROOT_CA:}
  metrics:
    enabled: true
  service-version: ${SERVICE_VERSION:0.0.0-local}
  tracing:
    header-name: ${TRACING_HEADER:x-cdp-request-id}
  cloudwatch:
    endpoint: ${AWS_EMF_AGENT_ENDPOINT:http://localhost:4566}
  proxyUrl: ${HTTP_PROXY:}

# AWS configuration
aws:
  region: ${AWS_REGION:eu-west-2}
  emf:
    enabled: ${AWS_EMF_ENABLED:true}
    environment: ${AWS_EMF_ENVIRONMENT:Local}
    namespace: ${AWS_EMF_NAMESPACE:trade-imports-plants-backend}
    service:
      name: ${AWS_EMF_SERVICE_NAME:trade-imports-plants-backend}
      type: ${AWS_EMF_SERVICE_TYPE:SpringBootApp}

# Logging configuration
logging:
  level:
    root: ${LOG_LEVEL:info}
    uk.gov.defra.trade.imports.plants: ${LOG_LEVEL:DEBUG}
    org.springframework: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:INFO}
    org.springframework.web: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}
    org.mongodb: ${LOGGING_LEVEL_ORG_MONGODB_DRIVER:WARN}
    io.netty.handler.logging.LoggingHandler: WARN
    sun.rmi: WARN
    javax.management.remote.rmi: WARN

# Actuator endpoints
# Production: Only health endpoint exposed (secure by default)
# Development: Use dev profile (application-local.yml) for debugging endpoints
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,metrics,info,cache
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
  health:
    mongo:
      enabled: false
  metrics:
    enabled: ${METRICS_ENABLED:true}
    enable:
      all: false
      controller: true
      jvm:
        memory:
          committed: true
          used: true
          max: true
        threads:
          live: true
          peak: true
      http:
        server:
          requests:
            active: true

notification:
  admin:
    page-size: 50
  list:
    page-size: 25
  # Automatic expiry of app-created notifications in non-prod environments.
  # Defaults here are the prod-safe values: days unset (no stamping) and sweep disabled.
  # Non-prod environments opt in via NOTIFICATION_TTL_DAYS and NOTIFICATION_TTL_SWEEP_ENABLED.
  ttl:
    days: ${NOTIFICATION_TTL_DAYS:}
    environment: ${ENVIRONMENT:local}
    sweep:
      enabled: ${NOTIFICATION_TTL_SWEEP_ENABLED:false}
      interval-ms: 3600000
      batch-size: 10
      lock-at-least-for: 1s
      lock-at-most-for: 30s

mongo:
  transaction:
    commit-retry:
      timeout-ms: ${MONGO_TX_COMMIT_RETRY_TIMEOUT_MS:120000}
      backoff-ms: ${MONGO_TX_COMMIT_RETRY_BACKOFF_MS:100}

# Application info (exposed via /info endpoint)
info:
  app:
    name: ${spring.application.name}
    version: ${cdp.service-version}
    environment: ${ENVIRONMENT:local}
